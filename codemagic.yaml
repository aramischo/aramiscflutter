workflows:
  ios-simulator-app:
    name: iOS Simulator .app
    max_build_duration: 60

    environment:
      flutter: 3.41.9
      xcode: 16.4

    scripts:
      - name: Clean
        script: |
          flutter clean

      - name: Get packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build Simulator Debug
        script: |
          flutter build ios --simulator --debug

    artifacts:
      - build/ios/iphonesimulator/Runner.app