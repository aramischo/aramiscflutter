workflows:
  ios-build:
    name: iOS Simulator .app
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator
        script: |
          flutter build ios --release --simulator

    artifacts:
      - build/ios/iphonesimulator/*.app