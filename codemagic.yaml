workflows:
  ios-build:
    name: iOS Clean Simulator Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - ~/.pub-cache

    scripts:
      - name: Full Clean
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -f ios/Podfile.lock

      - name: Get Packages
        script: |
          flutter pub get

      - name: Reinstall Pods
        script: |
          cd ios
          pod deintegrate
          pod install --repo-update
          cd ..

      - name: Build Simulator (no signing)
        script: |
          flutter build ios --simulator --release

    artifacts:
      - build/ios/iphonesimulator/*.app