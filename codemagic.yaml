workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60

  environment:
    flutter: 3.24.3
    xcode: 16.4
    cocoapods: 1.15.2

  scripts:
    - name: Clean
      script: |
        flutter clean
        rm -rf ios/Pods
        rm -rf ios/Podfile.lock
        rm -rf ~/Library/Developer/Xcode/DerivedData

    - name: Install
      script: |
        flutter pub get
        cd ios
        pod repo update
        pod install
        cd ..

    - name: Build
      script: |
        flutter build ios --release --no-codesign
