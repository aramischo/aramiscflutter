workflows:
  ios-workflow:
    name: iOS Production Build
    max_build_duration: 60

    environment:
      flutter: 3.24.3
      xcode: 16.4
      cocoapods: 1.15.2

    cache:
      cache_paths:
        - ~/.pub-cache
        - ios/Pods

    scripts:
      - name: Flutter Clean
        script: |
          flutter --version
          flutter clean

      - name: Remove Pods & DerivedData
        script: |
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Get Packages
        script: |
          flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod repo update
          pod install
          cd ..

      - name: Build iOS Release
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app
