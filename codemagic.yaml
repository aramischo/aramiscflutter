workflows:
  ios-build:
    name: iOS Simulator Build
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Clean & Get
        script: |
          flutter clean
          flutter pub get

      - name: Install Pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Simulator (Debug)
        script: |
          flutter build ios --simulator

    artifacts:
      - build/ios/iphonesimulator/*.app