workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      flutter: 3.24.3
      xcode: 16.4
      cocoapods: default
    scripts:
      - name: Build iOS
        script: |
          flutter clean
          flutter pub get
          cd ios && rm -rf Pods && rm -f Podfile.lock && pod install --repo-update && cd ..
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app